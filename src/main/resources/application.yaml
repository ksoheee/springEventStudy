server:
  port: 8080
spring:
  application:
    name: back  #springboot의 애플리케이션 이름
  profiles:
    active: dev #springboot의 profile(실행 프로필)을 dev로
  config:
    import: optional:file:.env[.properties] #프로젝트 루트의 .env파일을 설정값으로
  output:
    ansi:
      enabled: always #터미널 로그에 색상 적용
  jackson:
    serialization:
      fail-on-empty-beans: false  #직렬화할 속성을 찾지 못하는 객체가 있어도 예외 발생 x
  jpa:
    hibernate:
      ddl-auto: update    #DB테이블 구조를 update로
    open-in-view: false   #영속성 컨텍스트를 controller응답을 만드는 시점까지 길제 유지 하지 x
    show-sql: true        #하이버네이트가 실행하는 sql 콘솔에 출력
    properties:
      hibernate:
        format_sql: true    #sql 줄바꿈/들여쓰기
        highlight_sql: true #sql 색상 적용
        use_sql_comments: true  #sql에 주석 정보 추가
        default_batch_fetch_size: 100

logging:
  level:
    com.back: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
custom:
  global:
    internalBackUrl: http://localhost:${server.port:8080}
    holdingMemberId: 2    #프로젝트에서 memberid 2를 특정 보관용 회원으로 사용하기 위한 설정
  member:
    password:
      changeDays: 90
  market:
    toss:
      payments:
        secretKey: ${TOSS_PAYMENTS_SECRET_KEY:}
    product:
      payoutRate: 90
